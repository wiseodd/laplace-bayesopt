[project]
name = "laplace-bayesopt"
version = "0.2.0"
description = "Bayesian optimization interface for the laplace-torch library"
authors = [{ name = "Agustinus Kristiadi", email = "agustinus@kristia.de" }]
dependencies = [
    "torch>=2.4",
    "laplace-torch>=0.5.1",
    "botorch>=0.18.1",
    "gpytorch>=1.15",
]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/wiseodd/laplace-bayesopt"
Issues = "https://github.com/wiseodd/laplace-bayesopt/issues"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17.5",
    "mypy>=2.4",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pyflakes (`F`) and a subset of pycodestyle (`E`), plus isort (`I`),
# pyupgrade (`UP`), and pylint errors and warnings (`PLE`, `PLW`).
select = ["E4", "E7", "E9", "F", "I", "UP", "PLE", "PLW"]
# Ignore pylint's overwritten loop variable by assignment error
# Skip "Module level import not at top of file"
ignore = ["PLW2901", "E402"]

[tool.mypy]
ignore_missing_imports = true

[tool.pyright]
exclude = [".venv"]
venvPath = "."
venv = ".venv"
